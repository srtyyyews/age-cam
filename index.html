<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Trap Kitty Age Style</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Press+Start+2P&display=swap');
  
  body {
    margin: 0;
    background: linear-gradient(180deg, #000, #1a001f);
    color: #ff9ad5;
    font-family: 'Orbitron', sans-serif;
    text-align: center;
  }

  h2 {
    font-family: 'Press Start 2P', cursive;
    font-size: 16px;
    margin: 10px 0;
    color: #ff5fcf;
    text-shadow: 0 0 12px #ff5fcf;
    animation: glow 1.5s ease-in-out infinite alternate;
  }

  @keyframes glow {
    from { text-shadow: 0 0 6px #ff5fcf, 0 0 10px #ff5fcf; }
    to { text-shadow: 0 0 20px #ff82d1, 0 0 30px #ff82d1; }
  }

  .container {
    position: relative;
    max-width: 420px;
    margin: auto;
  }

  video {
    width: 100%;
    transform: scaleX(-1);
    border-radius: 14px;
    border: 3px solid #ff5fcf;
    box-shadow: 0 0 25px #ff5fcf;
  }

  #age {
    margin-top: 14px;
    font-size: 24px;
    text-shadow: 0 0 10px #ff5fcf;
  }

  .trappa {
    width: 120px;
    margin-top: -20px;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0% { transform: translateY(0px) scale(1); }
    50% { transform: translateY(-8px) scale(1.03); }
    100% { transform: translateY(0px) scale(1); }
  }
</style>
</head>

<body>

<h2>TRAP KITTY AGE VIBE</h2>

<div class="container">
  <!-- PNG КАРТИНКА YUNG TRAPPA -->
  <img src="trappa.png" class="trappa" alt="Yung Trappa">

  <video id="video" autoplay muted playsinline></video>
</div>

<div id="age">загрузка вайба…</div>

<script src="https://unpkg.com/face-api.js@0.22.2/dist/face-api.min.js"></script>

<script>
const video = document.getElementById("video");
const ageText = document.getElementById("age");

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" }
    });
    video.srcObject = stream;
  } catch (err) {
    ageText.innerText = "камеру не включить!";
  }
}

async function loadModels() {
  await faceapi.nets.tinyFaceDetector.loadFromUri("./weights");
  await faceapi.nets.tinyAgeGenderNet.loadFromUri("./weights");
}

async function detectAge() {
  const result = await faceapi
    .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
    .withAgeAndGender();

  if (result) {
    ageText.innerText = `🔥 ${Math.round(result.age)} лет 🔥`;
  } else {
    ageText.innerText = "лицо не видно";
  }
}

(async () => {
  ageText.innerText = "врубаю вайб…";
  await startCamera();
  await loadModels();
  setInterval(detectAge, 1200);
})();
</script>

</body>
</html>
