<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Face Detection</title>
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js"></script>
</head>
<body>
  <h2>Face Detection</h2>
  <img id="inputImage" src="trappa.png" alt="Image" />
  <canvas id="overlay"></canvas>

  <script>
    async function run() {
      await faceapi.nets.tinyFaceDetector.loadFromUri('/');
      await faceapi.nets.ageGenderNet.loadFromUri('/');

      const img = document.getElementById('inputImage');
      const canvas = document.getElementById('overlay');
      faceapi.matchDimensions(canvas, { width: img.width, height: img.height });

      const detections = await faceapi.detectAllFaces(img, new faceapi.TinyFaceDetectorOptions()).withAgeAndGender();
      const resized = faceapi.resizeResults(detections, { width: img.width, height: img.height });

      faceapi.draw.drawDetections(canvas, resized);
      resized.forEach(d => {
        const { age, gender, genderProbability } = d;
        const box = d.detection.box;
        const text = `${Math.round(age)} лет, ${gender} (${(genderProbability*100).toFixed(0)}%)`;
        const drawBox = new faceapi.draw.DrawBox(box, { label: text });
        drawBox.draw(canvas);
      });
    }

    run();
  </script>
</body>
</html>
