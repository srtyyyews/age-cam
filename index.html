<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Age Cam</title>

  <!-- face-api -->
  <script defer src="https://unpkg.com/face-api.js"></script>

  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #ffb6d5, #ffd6e8);
      font-family: Arial, sans-serif;
      text-align: center;
      color: #fff;
      overflow: hidden;
    }

    h1 {
      margin-top: 10px;
      text-shadow: 0 0 10px #ff69b4;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 5px #ff69b4; }
      to { text-shadow: 0 0 20px #ff1493; }
    }

    video {
      margin-top: 15px;
      width: 85%;
      max-width: 320px;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(255, 105, 180, 0.8);
    }

    #age {
      margin-top: 15px;
      font-size: 26px;
      background: rgba(255, 105, 180, 0.6);
      display: inline-block;
      padding: 10px 20px;
      border-radius: 30px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    #trappa {
      position: fixed;
      bottom: 0;
      right: 0;
      width: 120px;
      opacity: 0.85;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }
  </style>
</head>

<body>

  <h1>AGE CAM 💗</h1>

  <video id="video" autoplay muted playsinline></video>

  <div id="age">loading...</div>

  <img id="trappa" src="trappa.png" alt="Yung Trappa" />

  <script>
    const video = document.getElementById("video");
    const ageDiv = document.getElementById("age");

    async function startCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" }
      });
      video.srcObject = stream;
    }

    async function loadModels() {
      await faceapi.nets.tinyFaceDetector.loadFromUri("./");
      await faceapi.nets.tinyAgeGenderNet.loadFromUri("./");
    }

    async function detectAge() {
      setInterval(async () => {
        const result = await faceapi
          .detectSingleFace(
            video,
            new faceapi.TinyFaceDetectorOptions()
          )
          .withAgeAndGender();

        if (result) {
          ageDiv.innerText = Math.round(result.age) + " лет";
        }
      }, 700);
    }

    async function init() {
      ageDiv.innerText = "loading models...";
      await loadModels();
      await startCamera();
      ageDiv.innerText = "looking at you 👀";
      detectAge();
    }

    init();
  </script>

</body>
  </html>
