<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Age Cam</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script defer src="https://cdn.jsdelivr.net/npm/face-api.js"></script>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffb6d5, #000);
    color: #fff;
    text-align: center;
    overflow: hidden;
  }

  h1 {
    margin: 15px 0 5px;
    font-size: 24px;
    animation: glow 2s infinite alternate;
  }

  @keyframes glow {
    from { text-shadow: 0 0 10px pink; }
    to { text-shadow: 0 0 25px hotpink; }
  }

  .container {
    position: relative;
    width: 100%;
    max-width: 360px;
    margin: auto;
  }

  video, canvas {
    width: 100%;
    border-radius: 20px;
  }

  canvas {
    position: absolute;
    left: 0;
    top: 0;
  }

  button {
    margin-top: 15px;
    padding: 12px 25px;
    font-size: 16px;
    border: none;
    border-radius: 30px;
    background: hotpink;
    color: #000;
    cursor: pointer;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }

  .trappa {
    width: 120px;
    margin-top: 10px;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
    100% { transform: translateY(0); }
  }
</style>
</head>

<body>
<h1>🐱 Hello Kitty × Trappa 🔥</h1>

<div class="container">
  <video id="video" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>
</div>

<button onclick="detectAge()">Узнать возраст</button>

<br>
<img src="trappa.png" class="trappa" alt="trappa">

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');

async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user" }
  });
  video.srcObject = stream;
}

async function loadModels() {
  await faceapi.nets.tinyFaceDetector.loadFromUri('./');
  await faceapi.nets.ageGenderNet.loadFromUri('./');
}

async function detectAge() {
  const displaySize = {
    width: video.videoWidth,
    height: video.videoHeight
  };

  canvas.width = displaySize.width;
  canvas.height = displaySize.height;

  const detections = await faceapi
    .detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
    .withAgeAndGender();

  const resized = faceapi.resizeResults(detections, displaySize);
  canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);

  resized.forEach(d => {
    const age = Math.round(d.age);
    const gender = d.gender;
    const box = d.detection.box;

    const label = `${age} лет • ${gender}`;
    new faceapi.draw.DrawBox(box, { label }).draw(canvas);
  });
}

(async () => {
  await loadModels();
  await startCamera();
})();
</script>
</body>
</html>
